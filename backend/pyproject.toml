[project]
name = "paul"
version = "2.0.0a1"
requires-python = ">=3.13"

dependencies = [
  "django~=5.2.0",
  "django-allauth[socialaccount]~=65.9.0",
  "django-auditlog~=3.1.2",
  "django-cors-headers~=4.7.0",
  "django-environ~=0.12.0",
  "django-localflavor~=4.0.0",
  "django-vite~=3.1.0",
  "inertia-django~=1.2.0",
  "unidecode~=1.4.0",
  "django-q2~=1.8.0",
  "blessed~=1.21.0",
  "psutil~=7.0.0",
  "django-recaptcha~=4.1.0",
  "django-ses~=4.4.0",
  "django-storages[azure,s3]~=1.14.6",
  "sentry-sdk[django]~=2.30.0",
  "requests~=2.32.3",
  "psycopg2-binary~=2.9.10",
  "gevent~=25.5.1",
  "gunicorn~=23.0.0",
  "whitenoise~=6.9.0",
  "ngohub~=0.1.0",
  "pydantic>=2.11.7",
]


[dependency-groups]
ruff = ["ruff~=0.12.5"]
dev = [
  "faker~=37.1.0",
  "pre-commit~=4.2.0",
  "debugpy~=1.8.14",
  { include-group = "ruff" },
]


[lint]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
ignore = []

select = [
  "DJ", # Flake8-Django - https://docs.astral.sh/ruff/rules/#flake8-django-dj
  "E", # Pycodestyle errors - https://docs.astral.sh/ruff/rules/#error-e
  "W", # Pycodestyle warnings - https://docs.astral.sh/ruff/rules/#warning-w
  "F", # Pyflakes - https://docs.astral.sh/ruff/rules/#pyflakes-f
  "T10", # Debugger - https://docs.astral.sh/ruff/rules/#flake8-debugger-t10
  "T20", # Remove print/pprint statements - https://docs.astral.sh/ruff/rules/#flake8-print-t20
]
# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["A", "B", "C", "D", "E", "F", "G", "I", "N", "Q", "S", "T", "W", "ANN", "ARG", "BLE", "COM", "DJ", "DTZ", "EM", "ERA", "EXE", "FBT", "ICN", "INP", "ISC", "NPY", "PD", "PGH", "PIE", "PL", "PT", "PTH", "PYI", "RET", "RSE", "RUF", "SIM", "SLF", "TCH", "TID", "TRY", "UP", "YTT"]
unfixable = []


[tool.ruff.format]
exclude = [
  "migrations"
]


[tool.ruff]
# Enable the following rules
# More info: https://docs.astral.sh/ruff/rules/

# Exclude a variety of commonly ignored directories.
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".git-rewrite",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".pytype",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  ".vscode",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "venv",
  "migrations",
  "_legacy_v1",
]

line-length = 120

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.ruff.lint.extend-per-file-ignores]
"paul/settings/__init__.py" = ["F403"]


[tool.uv]
package = false
